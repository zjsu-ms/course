services:
  mysql:
    image: mysql:8
    container_name: course-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: course_db
      MYSQL_USER: courseuser
      MYSQL_PASSWORD: coursepass
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - course-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: course-app
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/course_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: courseuser
      SPRING_DATASOURCE_PASSWORD: coursepass
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - course-network

networks:
  course-network:
    driver: bridge

volumes:
  mysql-data:
    name: course_mysql-data
